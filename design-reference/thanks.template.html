<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DialogTrack request received</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&amp;family=Golos+Text:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F3F5F8}
a{color:#11141A}a:hover{color:#3A4150}
*{box-sizing:border-box}
:focus-visible{outline:3px solid #11141A;outline-offset:3px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
input,button{font:inherit}
</style>
</helmet>
<div lang="{{lang}}" style="font-family: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #11141A; background: #F3F5F8; font-size: 17px; line-height: 1.55; min-height: 100vh">

<header style="position: relative; z-index: 5; border-bottom: 1px solid #DCE1E8">
<div style="max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #11141A; min-height: 44px">
<svg width="34" height="20" viewBox="0 0 34 20" aria-hidden="true"><rect x="1" y="1" width="32" height="18" rx="9" fill="#11141A"></rect><circle cx="10" cy="10" r="3" fill="#F2555A"></circle><rect x="17" y="8" width="2" height="5" rx="1" fill="#F5F1E6"></rect><rect x="21" y="6" width="2" height="8" rx="1" fill="#F5F1E6"></rect><rect x="25" y="8.5" width="2" height="4" rx="1" fill="#F5F1E6"></rect></svg>
<span style="font-family: Geologica, 'Golos Text', system-ui, sans-serif; font-weight: 600; font-size: 19px; letter-spacing: -0.01em">DialogTrack</span>
</a>
<a href="Main.dc.html" style="margin-left: auto; font-size: 15px; color: #3A4150; padding: 8px 0">{{t.home}}</a>
<div style="position: relative">
<button type="button" onClick="{{toggleLang}}" aria-haspopup="true" aria-expanded="{{langOpenAttr}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #C3CAD5; background: #FFFFFF; color: #11141A; font-size: 15px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="#11141A" stroke-width="1.4"></circle><path d="M2 9h14M9 2c2.2 2 3.2 4.3 3.2 7s-1 5-3.2 7M9 2C6.8 4 5.8 6.3 5.8 9s1 5 3.2 7" fill="none" stroke="#11141A" stroke-width="1.4" stroke-linecap="round"></path></svg>
<span class="sr-only">{{t.langAria}}:</span>
<span>{{langName}}</span>
<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="#11141A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
<sc-if value="{{langOpen}}" hint-placeholder-val="{{false}}">
<ul style="position: absolute; right: 0; top: calc(100% + 8px); z-index: 6; min-width: 220px; margin: 0; padding: 6px; list-style: none; background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 14px; box-shadow: 0 18px 40px -18px rgba(13,18,32,0.35); display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="8">
<li><button type="button" onClick="{{l.pick}}" lang="{{l.code}}" aria-current="{{l.currentAttr}}" style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: {{l.bg}}; color: #11141A; font-size: 16px; font-weight: {{l.weight}}; text-align: left; cursor: pointer"><span>{{l.name}}</span><span aria-hidden="true" style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 400; color: #555D6B">{{l.tag}}</span></button></li>
</sc-for>
</ul>
</sc-if>
</div>
</div>
</header>

<main style="padding: 80px 24px 96px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start">

<div style="flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<div aria-hidden="true" style="width: 64px; height: 34px; border-radius: 17px; background: #000000; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 18 18"><path d="M4 9.5l3.2 3.2L14 5.8" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
<h1 style="margin: 0; font-family: Geologica, system-ui, sans-serif; font-weight: 600; font-size: clamp(2.2rem, 4vw, 3.4rem); line-height: 1.05; letter-spacing: -0.03em; text-wrap: balance">{{t.h1}}</h1>
<p style="margin: 0; font-size: 19px; color: #3A4150; max-width: 32em">{{t.lead}}</p>

<ol style="list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 0; border-top: 1px solid #DCE1E8">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<li style="display: flex; gap: 18px; padding: 18px 0; border-bottom: 1px solid #DCE1E8"><span style="flex: 0 0 auto; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; color: #555D6B; width: 24px; padding-top: 2px">{{s.n}}</span><div><h2 style="margin: 0 0 4px; font-size: 18px; font-weight: 600">{{s.title}}</h2><p style="margin: 0; color: #3A4150">{{s.text}}</p></div></li>
</sc-for>
</ol>
</div>

<div style="flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section aria-labelledby="ref-title" style="background: #0D1220; color: #F5F1E6; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 16px">
<h2 id="ref-title" style="margin: 0; font-family: Geologica, system-ui, sans-serif; font-weight: 600; font-size: 24px; letter-spacing: -0.01em">{{t.refTitle}}</h2>
<p style="margin: 0; color: #C3CAD7">{{t.refText}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<label for="ref-link" class="sr-only">{{t.refLabel}}</label>
<input id="ref-link" type="text" readonly="readonly" value="https://[DOMAIN]/beta?ref=k7f2q" style="flex: 1 1 220px; min-width: 0; height: 50px; padding: 0 14px; border-radius: 10px; border: 1px solid #2C3550; background: #161D2E; color: #F5F1E6; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px">
<button type="button" onClick="{{copy}}" style="height: 50px; padding: 0 20px; border-radius: 10px; border: 0; background: {{accent}}; color: #11141A; font-weight: 600; cursor: pointer">{{copyLabel}}</button>
</div>
<p style="margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: #9AA3B5">{{t.refCount}}</p>
</section>
<section aria-labelledby="ch-title" style="border: 1px solid #DCE1E8; background: #FFFFFF; border-radius: 20px; padding: 24px 28px; display: flex; flex-direction: column; gap: 10px">
<h2 id="ch-title" style="margin: 0; font-family: Geologica, system-ui, sans-serif; font-weight: 600; font-size: 20px">{{t.chTitle}}</h2>
<p style="margin: 0; color: #3A4150">{{t.chText}}</p>
<a href="#channel" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1.5px solid #11141A; text-decoration: none; font-weight: 600; font-size: 15px">{{t.chBtn}}</a>
</section>
</div>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='__PROPS__'>
class Component extends DCLogic {
  i18n() {
    if (!this._i18n) this._i18n = __I18N__;
    return this._i18n;
  }
  siteLangs() { return __SITE_LANGS__; }
  stored() {
    try { return window.sessionStorage.getItem('dt-lang'); } catch (e) { return null; }
  }
  renderVals() {
    const st = this.state || {};
    const all = this.i18n();
    const stored = this.stored();
    const lang = all[st.lang] ? st.lang : (all[this.props.lang] ? this.props.lang : (all[stored] ? stored : 'en'));
    const t = all[lang];
    const open = !!st.langOpen;
    const copied = !!st.copied;
    const site = this.siteLangs();
    const selectLink = () => {
      const el = document.getElementById('ref-link');
      if (el && el.select) el.select();
    };
    return {
      t: t,
      lang: lang,
      langName: (site.find((l) => l.code === lang) || site[0]).name,
      langOpen: open,
      langOpenAttr: open ? 'true' : 'false',
      toggleLang: () => this.setState({ langOpen: !open }),
      langs: site.map((l) => {
        const current = l.code === lang;
        return {
          code: l.code,
          name: l.name,
          tag: l.code.toUpperCase(),
          currentAttr: current ? 'true' : 'false',
          weight: current ? '600' : '400',
          bg: current ? '#EEF1F5' : 'transparent',
          pick: () => {
            this.setState({ lang: l.code, langOpen: false });
            try { window.sessionStorage.setItem('dt-lang', l.code); } catch (e) {}
          }
        };
      }),
      steps: t.steps,
      accent: this.props.accent ?? '#F2B53A',
      copyLabel: copied ? t.copied : t.copy,
      copy: () => {
        const text = 'https://[DOMAIN]/beta?ref=k7f2q';
        const done = () => this.setState({ copied: true });
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, selectLink);
          } else {
            selectLink();
          }
        } catch (e) {
          selectLink();
        }
      }
    };
  }
}
</script>
</body>
</html>
